name: CI

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test_source_format:
    name: Test source code against Black formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: psf/black@stable

  build_wheel:
    needs: [ test_source_format ]
    name: Build pure-Python wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build wheel
        run: pipx run build

      - uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/*

  test_wheel:
    needs: [ build_wheel ]
    name: Test pure-Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: artifact
          path: dist
      - name: Test wheel
        run: |
          export WHEELFILE=`ls -1 dist/*.whl | head -n 1`
          python -m venv pkilint-testbed
          source pkilint-testbed/bin/activate
          pip install "$WHEELFILE[dev]"
          pytest

  build_and_push_docker:
    needs: [ test_wheel ]
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: artifact
          path: docker/dist
      - name: Set environment variables
        run: |
          cd docker/dist && echo WHEELFILE=$(ls -1 *.whl) >> $GITHUB_ENV
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
          build-args:
            WHEELFILE=${{ env.WHEELFILE }}
          context: docker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign Docker image
        if: github.event_name != 'pull_request'
        uses: digicert/digicert-container-signing-action@v1.0.2
        with:
          input: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          keypair-alias: ${{ secrets.SM_DOCKER_KEYPAIR_ALIAS }}
          registry-url: ${{ env.REGISTRY }}
          recursive: 'true'
          verify: 'true'
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.3
      - name: Verify Docker image signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify --key docker/cosign_public_key.pem "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"

  upload_pypi:
    needs: [ build_wheel, test_wheel ]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/pkilint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: artifact
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
